server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/pooler_bank
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.application.name=pooler_bank

app.jwt-secret=34cdcf6a80b7324eabc8d931c329855815b0eb3bc1c4c6d9e4d0f7b584288bb3
app.jwt-expiration=86400000

logging.level.root=INFO
logging.file.name=myapp.log

# ── Apache Fineract ──────────────────────────────────────────────────────────
fineract.base-url=http://localhost:8443/fineract-provider/api/v1
fineract.username=mifos
fineract.password=password
fineract.tenant-id=default
fineract.savings-product-id=1
fineract.loan-product-id=1
fineract.connect-timeout=5
fineract.read-timeout=30

# ── Resilience4j retry (Fineract calls) ──────────────────────────────────────
resilience4j.retry.instances.fineract.max-attempts=3
resilience4j.retry.instances.fineract.wait-duration=1s
resilience4j.retry.instances.fineract.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException

# ── Swagger / SpringDoc ───────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Payment Module ────────────────────────────────────────────────────────────
# true  = simulate locally (no Fineract call) — use for sandbox/dev
# false = call real Fineract deposit/withdraw APIs — use for production
payment.simulation.enabled=true

# ── Keycloak / OAuth2 Resource Server ────────────────────────────────────────
# Spring Boot uses these to fetch Keycloak's public keys and validate
# RS256 tokens on the admin filter chain (Chain 1).
# Customer tokens (Chain 2) are still validated using app.jwt-secret below.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/pooler-bank
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/pooler-bank/protocol/openid-connect/certs

# Keycloak Admin API config (used by KeycloakAdminService during registration)
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=pooler-bank
keycloak.client-id=pooler-bank-app
keycloak.client-secret=CHANGE_ME
keycloak.admin-client-id=admin-cli
keycloak.admin-username=admin
keycloak.admin-password=admin

# ── Paystack ──────────────────────────────────────────────────────────────────
# Use your Paystack test keys for sandbox, live keys for production
paystack.base-url=https://api.paystack.co
paystack.secret-key=sk_test_REPLACE_WITH_YOUR_KEY
paystack.callback-url=http://localhost:8081/api/v1/payments/paystack/callback
paystack.webhook-header=x-paystack-signature

# ── Resilience4j retry — Paystack (alongside existing fineract retry) ─────────
resilience4j.retry.instances.paystack.max-attempts=3
resilience4j.retry.instances.paystack.wait-duration=2s
resilience4j.retry.instances.paystack.retry-exceptions=java.io.IOException,java.util.concurrent.TimeoutException

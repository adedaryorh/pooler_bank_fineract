version: "3.9"

services:

  # ── PostgreSQL — shared by app AND Keycloak ──────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: pooler_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pooler_bank        # default db; init script also creates keycloak db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    container_name: pooler_keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ── Apache Fineract DB (MySQL) ────────────────────────────────────────────
  fineract-db:
    image: mysql:8.0
    container_name: fineract_mysql
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: fineract_tenants
    ports:
      - "3306:3306"
    volumes:
      - fineractdbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Apache Fineract ───────────────────────────────────────────────────────
  fineract:
    image: apache/fineract:latest
    container_name: fineract
    depends_on:
      fineract-db:
        condition: service_healthy
    environment:
      FINERACT_HIKARI_JDBC_URL: jdbc:mysql://fineract-db:3306/fineract_tenants
      FINERACT_HIKARI_USERNAME: root
      FINERACT_HIKARI_PASSWORD: mysql
      FINERACT_DEFAULT_TENANTDB_HOSTNAME: fineract-db
      FINERACT_DEFAULT_TENANTDB_PORT: "3306"
      FINERACT_DEFAULT_TENANTDB_UID: root
      FINERACT_DEFAULT_TENANTDB_PWD: mysql
      JAVA_TOOL_OPTIONS: "-Xmx1g"
    ports:
      - "8443:8443"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:8443/fineract-provider/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # ── Pooler Bank Spring Boot App ───────────────────────────────────────────
  pooler-bank:
    build: .
    container_name: pooler_bank_app
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      fineract:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pooler_bank
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      # Fineract
      FINERACT_BASE_URL: https://fineract:8443/fineract-provider/api/v1
      FINERACT_USERNAME: mifos
      FINERACT_PASSWORD: password
      FINERACT_TENANT_ID: default
      FINERACT_SAVINGS_PRODUCT_ID: 1
      FINERACT_LOAN_PRODUCT_ID: 1
      # Keycloak — admin chain (Chain 1)
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/pooler-bank
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/pooler-bank/protocol/openid-connect/certs
      KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: pooler-bank
      KEYCLOAK_CLIENT_ID: pooler-bank-app
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-CHANGE_ME}
      KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Customer JWT — customer chain (Chain 2)
      APP_JWT_SECRET: ${JWT_SECRET:-34cdcf6a80b7324eabc8d931c329855815b0eb3bc1c4c6d9e4d0f7b584288bb3}
      APP_JWT_EXPIRATION: 86400000
      # Payment simulation
      PAYMENT_SIMULATION_ENABLED: "true"
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-sk_test_REPLACE_WITH_YOUR_KEY}
      PAYSTACK_CALLBACK_URL: http://localhost:8081/api/v1/payments/paystack/callback
    ports:
      - "8081:8081"

volumes:
  pgdata:
  fineractdbdata:
